# Dependabot: weekly update PRs for every package ecosystem the repository uses.
#
# Minor and patch updates come grouped, one PR per ecosystem and week; a major update
# comes on its own, because it can need code changes. Security updates are not held to
# this schedule: GitHub opens them as soon as an advisory names a locked version.
# bundle-audit in guards.yml stays the gate on every PR, with its own advisory database.
#
# The workflows pin each action by commit hash with the version in a comment; Dependabot
# updates hash and comment together.
version: 2

updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      bundler-minor-and-patch:
        update-types: [minor, patch]
    # json 3 is held back in the Gemfile until the app is ready for it (see there).
    ignore:
      - dependency-name: json
        update-types: ["version-update:semver-major"]
      # Tailwind stays on version 3 for good (see the Gemfile): no version 4 of the
      # Rails gem or of the binary, ever.
      - dependency-name: tailwindcss-rails
        versions: [">= 4"]
      - dependency-name: tailwindcss-ruby
        versions: [">= 4"]
      # pagy 43 is a new API (the initializer no longer boots, 56 files use pagy);
      # moving to it is its own change, not a weekly update.
      - dependency-name: pagy
        update-types: ["version-update:semver-major"]
      # acts_as_tenant stays on version 1 for good (see the Gemfile): no version 2
      # or later, ever.
      - dependency-name: acts_as_tenant
        versions: [">= 2"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

# No docker entry: the Dockerfile builds its base image name from ${RUBY_VERSION}
# (.ruby-version), which Dependabot cannot follow.
