<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img" aria-labelledby="t">
<!-- Lala, the Lalabase mascot. Copyright 2026 GBoyke Solutions. All rights reserved.
     Not covered by the AGPL license of this repository: no permission is granted to copy,
     modify or use this figure outside this repository.
     The light and dark files differ only in their colours; a change goes into both. -->
<title id="t">Lala asks the Lalabase assistant how many hours went into a project; the answer names its sources.</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .fb { transform-box: fill-box; transform-origin: center; }

  /* Every element rests in its final state; the animation only leads there.
     Without motion (prefers-reduced-motion) the last frame shows at once. */
  #lala   { animation: rise .5s cubic-bezier(.3,1.6,.6,1) both; }
  #bubble { animation: pop .35s .5s cubic-bezier(.3,1.5,.6,1) both; transform-origin: 150px 70px; }
  #cover  { animation: type 1.5s .85s steps(56) both; }
  #card   { animation: rise .45s 2.5s ease-out both; }
  .dot    { opacity: 0; animation: think 1.1s both; }
  .d1 { animation-delay: 2.9s; } .d2 { animation-delay: 3.05s; } .d3 { animation-delay: 3.2s; }
  #a1 { animation: fade .35s 4.1s both; }
  #a2 { animation: fade .35s 4.35s both; }
  .chip { animation: pop .3s cubic-bezier(.3,1.6,.6,1) both; }
  .c0 { animation-delay: 4.6s; } .c1 { animation-delay: 4.75s; } .c2 { animation-delay: 4.9s; } .c3 { animation-delay: 5.05s; }
  #armDown, #mouthFlat { opacity: 0; animation: until 5.1s both; }
  #armPoint, #smile    { animation: fade .2s 5.1s both; }
  #pupils { animation: look .3s 5.1s both; }
  #eyes   { animation: blink 4.5s 6.5s infinite; }

  @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop   { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes type  { from { transform: none; } to { transform: translateX(540px); } }
  @keyframes think { 0% { opacity: 0; } 15%, 55% { opacity: 1; } 35%, 75% { opacity: .25; } 99% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes until { 0%, 99.9% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes look  { from { transform: translate(-1px, -2px); } to { transform: none; } }
  @keyframes blink { 0%, 93%, 100% { transform: none; } 96% { transform: scaleY(.1); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g id="lala" class="fb">
  <ellipse cx="105" cy="210" rx="62" ry="8" fill="#F3EFE4" opacity=".14"/>
  <path d="M60 130L40 147" stroke="#F3EFE4" stroke-width="9" stroke-linecap="round"/>
  <path id="armDown" d="M100 130L120 147" stroke="#F3EFE4" stroke-width="9" stroke-linecap="round"/>
  <g id="armPoint">
    <path d="M100 128L168 112" stroke="#F3EFE4" stroke-width="9" stroke-linecap="round"/>
    <circle cx="170" cy="111.5" r="6" fill="#F3EFE4"/>
  </g>
  <path d="M60 50h40v124h60v36H60z" fill="#F3EFE4"/>
  <g id="eyes" class="fb">
    <circle cx="72" cy="82" r="8.5" fill="#FFFFFF" stroke="#16181C" stroke-width="2"/>
    <circle cx="88" cy="82" r="8.5" fill="#FFFFFF" stroke="#16181C" stroke-width="2"/>
    <g id="pupils">
      <circle cx="75" cy="81" r="4" fill="#16181C"/>
      <circle cx="91" cy="81" r="4" fill="#16181C"/>
    </g>
  </g>
  <path id="mouthFlat" d="M72 108h16" stroke="#16181C" stroke-width="5" stroke-linecap="round"/>
  <path id="smile" d="M70 106q10 11 20 0" stroke="#16181C" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>

<g id="bubble">
  <clipPath id="bubbleClip"><rect x="134" y="8" width="606" height="52" rx="14"/></clipPath>
  <rect x="134" y="8" width="606" height="52" rx="14" fill="#E4552B"/>
  <path d="M146 56h22L106 78z" fill="#E4552B"/>
  <g clip-path="url(#bubbleClip)">
    <text x="156" y="40" class="sans" font-size="18" font-weight="700" fill="#FFF7F3">How many hours went into the shop relaunch in September?</text>
    <rect id="cover" x="150" y="12" width="590" height="44" fill="#E4552B"/>
  </g>
</g>

<g id="card">
  <rect x="195" y="99" width="545" height="130" rx="6" fill="#E4552B"/>
  <rect x="189" y="93" width="545" height="130" rx="6" fill="#161B22" stroke="#F3EFE4" stroke-width="2.5"/>
  <text x="209" y="117" class="mono" font-size="11" letter-spacing="1.5" fill="#9DA3AB">LALABASE ASSISTANT</text>
  <circle class="dot d1" cx="215" cy="146" r="5" fill="#F3EFE4"/>
  <circle class="dot d2" cx="233" cy="146" r="5" fill="#F3EFE4"/>
  <circle class="dot d3" cx="251" cy="146" r="5" fill="#F3EFE4"/>
  <text id="a1" x="209" y="151" class="sans" font-size="24" font-weight="800" fill="#F3EFE4">38.5 hours across 12 tickets</text>
  <text id="a2" x="209" y="176" class="sans" font-size="14" fill="#9DA3AB">Most of it went into checkout and payment: 21 hours.</text>
  <g class="mono" font-size="12">
    <text class="chip c0 fb" x="209" y="206" fill="#9DA3AB">Sources</text>
    <g class="chip c1 fb"><rect x="270" y="192" width="128" height="20" rx="4" fill="#21262D" stroke="#F3EFE4" stroke-width="1.5"/><text x="279" y="206" fill="#F3EFE4">#142 Checkout</text></g>
    <g class="chip c2 fb"><rect x="406" y="192" width="120" height="20" rx="4" fill="#21262D" stroke="#F3EFE4" stroke-width="1.5"/><text x="415" y="206" fill="#F3EFE4">#157 Payment</text></g>
    <g class="chip c3 fb"><rect x="534" y="192" width="136" height="20" rx="4" fill="#21262D" stroke="#F3EFE4" stroke-width="1.5"/><text x="543" y="206" fill="#F3EFE4">Time list · Sep</text></g>
  </g>
</g>
</svg>
