# CodeQL: static analysis of the Ruby code, the JavaScript and the workflows themselves.
#
# Runs on every PR, on every push to main (so the code scanning view shows main) and once
# a week, because new queries find old code. Results land in the repository's code
# scanning view (Security tab), not in a failing check: a finding is triaged there.
# Brakeman in guards.yml stays the Rails-specific gate with its frozen baseline.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2' # Tuesdays 03:41 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: [ruby, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
