# Docker install check: builds the self-hosting image from the checkout and
# boots compose.yml with it (compose.build.yml, the way a self-hoster builds
# their own). The checks are script/docker_check, which docker-release.yml
# runs on each release image too.
#
# Our own servers do not run the image (they deploy with Capistrano), so
# nothing else would notice when it stops building or booting: a new native
# gem, a boot-time initializer that writes a file, a production setting that
# names our host. Each of those broke the first build on 2026-10-01.
#
# For pull requests that touch what goes into the image or how it boots, and
# once a week on main for everything else (app/ is eager-loaded at boot, but
# changes there too often to build the image for each one). A cold build takes
# several minutes of billed time (private repository). By hand via
# workflow_dispatch on any branch.
name: Docker

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yml'
      - 'compose.build.yml'
      - 'script/docker_check'
      - '.env.docker.example'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'config/**'
      - 'lib/**'
      - 'bin/**'
      - 'db/**'
      - 'vendor/**'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HOST: lalabase-ci.test:3000
      COMPOSE_FILE: compose.yml:compose.build.yml

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build

      - name: Boot and check the install
        run: script/docker_check
