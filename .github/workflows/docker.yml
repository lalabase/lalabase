# Docker install check: builds the self-hosting image and boots compose.yml.
#
# Our own servers do not run the image (they deploy with Capistrano), so
# nothing else would notice when it stops building or booting: a new native
# gem, a boot-time initializer that writes a file, a production setting that
# names our host. Each of those broke the first build on 2026-10-01.
#
# For pull requests that touch what goes into the image or how it boots, and
# once a week on main for everything else (app/ is eager-loaded at boot, but
# changes there too often to build the image for each one). A cold build takes
# several minutes of billed time (private repository). By hand via
# workflow_dispatch on any branch.
name: Docker

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yml'
      - '.env.docker.example'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'config/**'
      - 'lib/**'
      - 'bin/**'
      - 'db/**'
      - 'vendor/**'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A host that is not localhost: the health check in compose.yml calls /up
    # on localhost, so it passes only through the /up exemptions from the host
    # check and the https redirect. The pages are asked for with this host.
    env:
      HOST: lalabase-ci.test:3000

    steps:
      - uses: actions/checkout@v4

      # The .env a self-hoster would write without a certificate: fresh
      # secrets, plain http, no Caddy. Plus the DATABASE_URL line the guide
      # for installs without Docker shows: compose.yml must win over it.
      - name: Write .env from the example
        run: |
          cp .env.docker.example .env
          sed -i \
            -e "s/^LALABASE_HOST=.*/LALABASE_HOST=${HOST}/" \
            -e '/^COMPOSE_PROFILES=/d' \
            .env
          {
            echo "LALABASE_FORCE_SSL=false"
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 32)"
            echo "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 32)"
            echo "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "DATABASE_URL=postgres://lalabase:wrong@db:5432/lalabase_production"
          } >> .env

      - name: Build the image
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Health check, a page that needs the database, a foreign host
        run: |
          curl -fsS -o /dev/null http://localhost:3000/up
          curl -fsS -o /dev/null -H "Host: ${HOST}" http://localhost:3000/users/sign_in
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://localhost:3000/users/sign_in)
          test "$code" = "403" || { echo "::error::A foreign host got $code instead of 403"; exit 1; }

      - name: The data lands in the database the backups dump
        run: |
          docker compose exec -T db psql -U lalabase -d lalabase -tAc \
            "SELECT 1 FROM information_schema.tables WHERE table_name = 'schema_migrations'" | grep -qx 1

      # The compiled CSS carries its font URLs with the asset host burnt in.
      # A self-hosted instance must not load anything from our host. grep
      # exits 1 for "no match"; 0 is a match and 2 a failed search, both red.
      - name: No asset names our host
        run: |
          rc=0
          docker compose exec -T web grep -rl 'lalabase.com' public/assets || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::grep exited $rc: assets name lalabase.com (0) or could not be searched (2)"
            exit 1
          fi

      - name: First admin
        run: |
          docker compose exec -T \
            -e LALABASE_ADMIN_EMAIL=admin@example.org \
            -e LALABASE_ADMIN_PASSWORD=ci-check-password-123 \
            web bin/rails lalabase:setup

      # The worker stays up: Solid Queue exits at boot when the pool is
      # smaller than its threads, and compose would just keep restarting it.
      - name: Worker is running
        run: |
          sleep 10
          test "$(docker compose ps worker --format '{{.State}}')" = "running"
          docker compose logs worker | grep -q 'Started Worker'

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
