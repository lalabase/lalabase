  # Static analysis only — no DB, schema or RAILS_MASTER_KEY needed (rubocop does not boot Rails).
  # The JavaScript unit specs (node:test, no browser). They did not run here at
  # all until 29.08.2026, which made every one of them a guard that guards
  # nothing -- `npm test` was green on a laptop and never once in CI.
  #
  # The reason it was worth noticing: spec/javascript/lib/hover_reveal.test.js is
  # the ONLY place the "at most one row shows its actions" rule is pinned. That
  # rule used to live in nine CSS class strings where nothing could test it, and
  # moving it into code is pointless if the test never runs.
  #
  # ⚠️ The npm script globs *.test.js. Two older files under
  # spec/javascript/controllers are named *.spec.js and are NOT picked up by it --
  # they do not run here either. Renaming them is a separate cleanup; this job
  # deliberately runs the script rather than a second glob of its own, so there is
  # one answer to "which JS specs run".
  javascript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ⚠️ Node 22, not 20. The npm script passes a GLOB to `node --test`, and
      # glob patterns only became a thing --test understands in Node 21. On 20 the
      # job dies with "Could not find spec/javascript/**/*.test.js" -- which is at
      # least loud, but it cost this job its first run (29.08.2026). 22 is what the
      # suite is developed against.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript unit specs
        run: npm test

  # bin/lala, the terminal client (Python, standard library only). Its test
  # starts an in-process fake of the MCP endpoint and reaches no instance. Added
  # with `bin/lala inbox` (#961): the inbox prints text other members wrote into a
  # terminal and into a model's context, and the review of that PR found a forged
  # fzf row, an escape-sequence pass-through and a whole run lost to one
  # unreadable ticket, all of which a test would have caught. That this job
  # exists and finds tests is held by spec/architecture/python_tests_job_guard_spec.rb:
  # ci_guard_list_spec.rb reads only the rspec step.
  lala:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the bin/lala tests
        run: python3 -m unittest discover -s spec/python -p '*_test.py' -v

  rubocop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run RuboCop (gated against .rubocop_todo.yml baseline)
        run: bundle exec rubocop --format github

  # Our own code, gated against the frozen config/brakeman.ignore baseline, exactly the
  # deal rubocop gets above. The tree is green by construction, so a red run means a NEW
  # warning was introduced. The baseline entries are NOT reviewed and NOT approved; they
  # carry a dated note and belong to the open cleanup track. Shrinking that file IS the
  # cleanup, and it can only ever shrink.
  #
  # Deliberately NOT bin/brakeman: that shim forces --ensure-latest and exits 5 the day
  # a newer brakeman is released upstream, which turns someone else's release into our
  # red build. bundle exec pins it to the locked version.
  #
  # Static analysis only, no DB, schema or RAILS_MASTER_KEY needed.
  brakeman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan own code (gated against config/brakeman.ignore)
        run: bundle exec brakeman --no-pager --quiet --exit-on-warn

  # Vulnerable gems, checked WITHOUT an ignore list. A vulnerable gem is not drift, it is
  # a version number, and the answer is an update rather than a note. Red here means: go
  # update.
  #
  # Its OWN job on purpose, not a second step next to brakeman. GitHub reports one status
  # per job, not per step. This scan is red today (puma 6.6.0 carries two High CVEs, and
  # the dependency track that clears them needs major bumps that have not landed), so
  # sharing a job would make brakeman's red and this red the same red. Brakeman's entire
  # value is that its red means a NEW finding; co-located, it could no longer say that.
  #
  # No bundler-cache: bundle-audit reads Gemfile.lock and nothing else, so installing the
  # bundle here would buy nothing.
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      # Not in the Gemfile on purpose: this tool checks the lockfile, so it must not be
      # pinned by it. The advisory database has to be the current one on every run, not
      # the one that was current when the lock was written; --update fetches it first.
      - name: Install bundler-audit
        run: gem install bundler-audit -v '~> 0.9' --no-document

      - name: Scan dependencies (no ignore list)
        run: bundle-audit check --update
