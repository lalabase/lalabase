# Guard net: runs the curated guard/architecture specs on every PR.
#
# What it does NOT run on, because the minutes are billed (private repository,
# about 21 job minutes per run, 28.09.2026; about 22 since the `lala` job of
# 03.10.2026, every job bills at least one minute):
# * a push to main: a merge re-checked the code its PR had just checked green.
#   workflow_dispatch runs it by hand, on main or any branch.
# * a PR that only touches Markdown in the repository root (README, CLAUDE.md,
#   CONTRIBUTING, ...): no guard reads those. Only the root: the guards DO scan
#   Markdown under app/ (the CLAUDE.md maps, app/changelog), hence '*.md' and not
#   '**.md'. ⚠️ Once this check is required by branch protection, a skipped run
#   stays pending forever and blocks such a PR; drop the filter then.
# * a superseded commit: a new push to the same PR cancels the run in progress.
#
# Deliberately NOT the full suite (it carries known pre-existing drift failures —
# separate cleanup track). RuboCop DOES run here now (own job below), gated against a
# frozen .rubocop_todo.yml baseline: the current tree is green, so a red rubocop run
# means a NEW offense was introduced. Every guard spec listed here is likewise green
# by construction. The guards job also runs mobile browser regressions; a failure
# there can indicate a behavior regression or browser/test infrastructure failure.
#
# No repository credentials or master key are needed. Rails generates a local
# test secret; the encryption initializer derives test keys from it.
name: Guards

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image: schema needs the "vector" extension (plus pgcrypto/uuid-ossp).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lalabase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lalabase_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node for browser assets
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install browser assets
        run: npm ci --ignore-scripts && npm run copy:fonts

      # BEFORE the schema load, and deliberately as its own step: a duplicate
      # migration version makes every Rails boot raise, so this check has to run
      # while nothing has booted yet. Otherwise the cause is invisible and the
      # remaining steps all fail with the same opaque load error.
      - name: Guard against duplicate migration versions
        run: bundle exec rspec spec/config/migration_versions_spec.rb

      - name: Load database schema
        run: bin/rails db:schema:load

      # Needed since spec/requests/admin/organisations_spec.rb joined the list below:
      # it renders full pages, and the layout asks for the COMPILED tailwind.css.
      # Without this step every example in that file dies on stylesheet_link_tag, which
      # looks like seven unrelated failures rather than one missing asset.
      - name: Build Tailwind (the curated list contains view-rendering specs)
        run: bin/rails tailwindcss:build

      # spec/requests/active_storage/embed_link_expiry_spec.rb follows a rendered image
      # link through the variant processor; Rails 8 defaults to vips, which the runner
      # image does not ship. Production runs libvips 8.16.1, built from source because
      # Ubuntu 22.04 stops at 8.12.1 and Rails 8.0.5.1 refuses to boot below 8.13
      # (CVE-2026-66066, checked 2026-08-27).
      # ImageMagick is named explicitly rather than relied upon: the BMP conversion spec
      # shells out to it through mini_magick, and a runner image may drop it.
      # The runner image carries Google's Chrome apt source, and its index fails
      # now and then with "Hash Sum mismatch", which makes apt-get update exit
      # 100 before a single spec has run (three runs in a row on 09.09.2026).
      # Browser specs use Chrome already installed on the runner. No package is
      # installed from that source, so it goes before the update; libvips and
      # ImageMagick come from Ubuntu's own repositories.
      - name: Install libvips and ImageMagick (variant processing, BMP conversion)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.*
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvips-dev imagemagick

      - name: Run guard specs (curated list)
        run: >-
          bundle exec rspec
          spec/architecture/
          spec/requests/csv_exports_spec.rb
          spec/services/codebase_import/progress_serialization_spec.rb
          spec/services/docs/catalogue_spec.rb
          spec/services/docs/docs_catalogue_format_spec.rb
