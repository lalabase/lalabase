inherit_from: .rubocop_todo.yml

require: rubocop-rails

# Merge our Exclude list with RuboCop's built-in defaults instead of replacing them.
# Without this, declaring AllCops/Exclude silently drops RuboCop's default excludes
# (vendor/, node_modules/, tmp/, ...), causing vendored gems to be linted and gem
# .rubocop.yml files to crash the run.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - 'db/migrate/**/*'
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

# Keyword arguments are self-documenting and order-independent, so a long keyword list does not carry
# the positional-confusion risk this cop guards against (relevant for ViewComponent constructors).
Metrics/ParameterLists:
  CountKeywordArgs: false

# We deliberately and pervasively use update_column/touch/increment!/update_all for counters,
# timestamps and bulk operations where skipping validations is the intended behavior. Keeping this
# cop enabled would demand an inline disable on every such call (pure noise) and trip CI on every new
# legitimate skip. Disabled by policy — see doc: RuboCop-Cleanup Schritt 2.
Rails/SkipsModelValidations:
  Enabled: false

# `billing_street_2` is a DATABASE COLUMN (doc/billing_stammdaten_plan.md §4) and reads as
# "address line 2", not as a numbered variable. It appears in the migration, the model, the rules
# constant and the value object. Four inline disables would be the same exception documented four
# times over, which is the abstraction signal from CLAUDE.md; the exception belongs in data.
Naming/VariableNumber:
  AllowedIdentifiers:
    - billing_street_2
    - street_2
