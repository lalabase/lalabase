<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Lime background with black border (Neo Brutalist style) -->
  <rect width="30" height="30" x="1" y="1" fill="#bef264" stroke="#000000" stroke-width="2" rx="4"/>
  <!-- Shadow effect -->
  <rect width="30" height="30" x="3" y="3" fill="#000000" opacity="0.2" rx="4"/>
  <!-- Main square -->
  <rect width="30" height="30" x="1" y="1" fill="#bef264" stroke="#000000" stroke-width="2" rx="4"/>
  <!-- Letter L for Lalabase -->
  <text x="50%" y="52%" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900"
        text-anchor="middle" dominant-baseline="middle" fill="#000000">L</text>
</svg>