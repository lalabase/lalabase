# Throw-away mail domains rejected on self-service sign-up.
#
# DELIBERATELY SHORT AND CURATED. The big lists on the net have tens of
# thousands of entries, go stale constantly and regularly catch real company
# domains. This list covers the common services that practically never hide a
# genuine prospect.
#
# DOES NOT APPLY TO INVITATIONS: an invited person did not pick the address to
# stay anonymous but was written to at exactly that address
# (Users::RegistrationsController#create checks DisposableEmailDomains.match?
# only without a valid invitation).
#
# TO EXTEND: append the domain below, lower-case, without "@". Subdomains are
# covered too (mail.temp.example matches temp.example).
