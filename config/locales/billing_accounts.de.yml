# Rechnungsbereich auf Konto-Ebene (K2, doc/konto_ebene_plan.md).
#
# Eigene Datei statt eines Zweigs unter config/locales/views/organisation.de.yml: der
# Bereich haengt nicht mehr an einer Organisation, ein Zweig im Organisations-Baum waere
# am falschen Ort. View- UND Controller-Schluessel liegen hier zusammen, weil beide
# denselben Bereich beschreiben und diese Datei ausserhalb des views/-Ordners liegt
# (Vorbild: user_data_exports.de.yml).
#
# Vokabular (§7 des Plans): „Rechnung" als Menuepunkt, „Rechnungskonto" fuer die
# Kontoebene, „Rechnungsdaten" fuer die Felder. NICHT „Abrechnung": so heisst in dieser
# App die Zeit-Abrechnung, samt eigener Hilfeseite.
