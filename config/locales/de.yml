      long: "%d. %B %Y"
      short: "%d.%m."
      # Die zwei Grenzen einer Zeitraum-Pille (Zeitenliste, S7). Eigene
      # Formate, weil die Pille die Jahreszahl nur EINMAL traegt, am Ende:
      # "01.06. - 31.08.2026". short haette den Anfang geliefert, default das
      # Ende, aber in EN ist default ISO und die Mischung unlesbar.
      range_start: "%d.%m."
      range_bound: "%d.%m.%Y"
      # Monat und Jahr ohne Tag, fuer Zeitraum-Ueberschriften (Messmonat, M2).
      # Ein eigenes Format statt short: short traegt KEIN Jahr, und ein
      # Abrechnungszeitraum ohne Jahreszahl ist im Januar sofort mehrdeutig.
