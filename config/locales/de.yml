  helpers:
    select:
      prompt: Bitte wählen...
  # Sentence joining for Array#to_sentence ("Status, Priorität und Titel").
  # The same gap as number.* below: rails-i18n is not bundled, so without these
  # lines to_sentence fell back to the English Rails defaults and a German page
  # read "Status, Priorität, and Titel" (activity feed, 10.09.2026) - and so did
  # every flash message that joins validation errors.
  support:
    array:
      words_connector: ", "
      two_words_connector: " und "
      last_word_connector: " und "

  # Deutsche Zahlenformate. Das Projekt bindet rails-i18n NICHT ein, und ohne
  # diese Zeilen fällt number_to_currency & Co. auf die englischen Rails-Defaults
  # zurück — die deutsche Oberfläche zeigt dann "€14.50" statt "14,50 €".
  # Aufgefallen ist es auf der öffentlichen Preisseite (doc/billing_preisliste_
  # rabatt_plan.md §7); die Eingabeseite rechnete längst deutsch
  # (Subscriptions::MoneyInput parst "29,50 €").
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        unit: "€"
        separator: ","
        delimiter: "."
        precision: 2
    percentage:
      format:
        format: "%n %"
        separator: ","
        delimiter: "."
