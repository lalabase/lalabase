  services:
    extract_plain_text:
      errors:
        file_read_error: 'Fehler beim Lesen der %{file_type}-Datei: %{message}'
    notifications:
      preferences:
        help:
          ticket_assigned: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn Ihnen ein Ticket zugewiesen wird
            • Wenn Sie als Mitverantwortlicher hinzugefügt werden
            • Wenn die Zuweisung an Sie geändert wird
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Sie können diese Einstellung für einzelne Tickets überschreiben:
            → Im Ticket-Header mit dem Watch-Button (4 Modi verfügbar)
            → Watch = Standard-Benachrichtigungen (diese Einstellungen)
            → Following = Wichtige Updates folgen
            → Live Updates = ALLE Updates sofort
            → Muted = Komplett stumm (auch bei Zuweisung!)
            
            💡 TIPP: Nutzen Sie "Immediate" für kritische Projekte, bei denen Sie sofort reagieren müssen. Bei weniger wichtigen Projekten reicht oft "Daily digest".
          ticket_unassigned: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn Ihre Zuweisung von einem Ticket entfernt wird
            • Wenn Sie als Mitverantwortlicher entfernt werden
            • Wenn ein Ticket komplett unassigned wird
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Überschreibbar mit dem Watch-Button im Ticket-Header:
            → Muted = Keine Benachrichtigung, auch nicht bei Unassignment
            → Live Updates = Sofortige Benachrichtigung bei jeder Änderung
            
            💡 TIPP: Aktivieren Sie diese Benachrichtigung, um sicherzustellen, dass keine Tickets "verloren" gehen, wenn Zuweisungen entfernt werden.
          ticket_blocker: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn ein Ticket als Blocker markiert wird
            • Wenn die Priorität auf kritisch/blockierend geändert wird
            • Wenn ein kritisches Problem die Arbeit verhindert
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Mit dem Watch-Button können Sie einzelne Tickets anders behandeln:
            → Live Updates = Sofort über Blocker informiert werden
            → Muted = Auch kritische Blocker werden ignoriert (Vorsicht!)
            
            ⚠️ WICHTIG: Blocker betreffen oft mehrere Team-Mitglieder. Überlegen Sie gut, bevor Sie diese Benachrichtigungen deaktivieren. Ein übersehener Blocker kann das ganze Team aufhalten!
          ticket_commented: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn jemand einen Kommentar zu einem Ticket hinzufügt
            • Wenn Diskussionen in Tickets stattfinden
            • Bei Fragen oder Antworten zu Tickets
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Individuelle Kontrolle über den Watch-Button:
            → Following = Nur wichtige Kommentare
            → Live Updates = Jeden Kommentar sofort sehen
            → Muted = Keine Kommentar-Benachrichtigungen
            
            💡 TIPP: "Daily digest" ist ideal für normale Projekte. Bei aktiven Diskussionen können Sie temporär auf "Live Updates" für das spezifische Ticket wechseln.
          document_added: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn neue Dokumente zu einem Projekt hinzugefügt werden
            • Wenn Dateien hochgeladen oder verlinkt werden
            • Bei wichtigen Dokumenten-Updates
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Für tickets-bezogene Dokumente über Watch-Button steuerbar:
            → Following = Nur wichtige Dokumente
            → Muted = Keine Dokumenten-Benachrichtigungen
            
            💡 TIPP: Nützlich bei Projekten mit häufigen Dokumenten-Updates. Weekly digest reicht oft aus, es sei denn, Sie arbeiten aktiv mit den Dokumenten.
          ticket_status_changed: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn der Status eines Tickets geändert wird
            • Bei Fortschritt von "Offen" zu "In Bearbeitung" zu "Erledigt"
            • Bei Rückschritten oder Wiedereröffnungen
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            Kontrolle über einzelne Tickets mit Watch-Button:
            → Live Updates = Jede Status-Änderung sofort
            → Following = Nur wichtige Status-Änderungen
            → Muted = Keine Status-Updates
            
            💡 TIPP: Für Projekt-Manager oft auf "Immediate" sinnvoll. Entwickler bevorzugen meist "Daily digest", um nicht ständig unterbrochen zu werden.
          mention: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wenn Sie mit @IhrName erwähnt werden
            • In Kommentaren, Beschreibungen oder Diskussionen
            • Direkte Ansprache, die Ihre Aufmerksamkeit erfordert
            
            ⚙️ FEINSTEUERUNG PRO TICKET:
            ACHTUNG: Muted-Tickets blockieren auch @-Erwähnungen!
            → Watch/Following/Live = @-Erwähnungen kommen durch
            → Muted = BLOCKIERT auch direkte @-Erwähnungen
            
            ⚠️ WICHTIG: Diese Einstellung sollte fast immer auf "Immediate" stehen! @-Erwähnungen sind direkte Kommunikation und erwarten meist eine zeitnahe Reaktion.
          system_message: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Wichtige System-Ankündigungen
            • Wartungsarbeiten und Ausfallzeiten
            • Sicherheitsupdates und kritische Informationen
            
            ⚙️ FEINSTEUERUNG:
            System-Nachrichten sind global und können nicht pro Ticket gesteuert werden.
            
            ⚠️ WICHTIG: Wir empfehlen, diese Benachrichtigungen aktiviert zu lassen. Sie erhalten nur wichtige systemweite Informationen, keine Spam-Nachrichten.
          project_announcement: |
            🔔 WANN SIE BENACHRICHTIGT WERDEN:
            • Ankündigungen vom Projekt-Manager
            • Wichtige Projekt-Updates und Meilensteine
            • Team-weite Informationen und Deadlines
            
            ⚙️ FEINSTEUERUNG:
            Gilt für alle Tickets eines Projekts. Einzelne Tickets können über Watch-Button anders behandelt werden.
            
            💡 TIPP: "Weekly digest" ist oft ausreichend für allgemeine Ankündigungen. Bei zeitkritischen Projekten sollten Sie "Immediate" oder "Daily" wählen.
      fanout:
        errors:
          processing_failed: 'Benachrichtigungsverarbeitung fehlgeschlagen: %{message}'
      update_preferences:
        errors:
          organisation_required: Organisation erforderlich
          update_failed: 'Fehler beim Aktualisieren der Einstellungen: %{message}'
          user_required: Benutzer erforderlich
    preferences:
      help:
        ticket_assigned: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Wenn Ihnen ein Ticket zugewiesen wird\n• Wenn Sie zu einem bestehenden Ticket hinzugefügt werden\n• Wenn ein automatischer Workflow Sie zuweist\n• Wenn ein Ticket an Ihr Team delegiert wird\n\n⚙️ FEINSTEUERUNG PRO TICKET:\nSie können für jedes einzelne Ticket die Benachrichtigungen anpassen:\n• Watch-Button im Ticket-Header nutzen\n• 4 Modi: Watch → Following → Live Updates → Muted\n• 'Muted' überschreibt ALLE globalen Einstellungen\n\n💡 TIPP: Diese Benachrichtigungen sind kritisch für Ihre Arbeit und sollten normalerweise aktiv bleiben."
        ticket_unassigned: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Wenn Sie von einem Ticket entfernt werden\n• Wenn die Zuweisung geändert wird\n• Wenn ein Ticket neu zugewiesen wird\n\n⚙️ FEINSTEUERUNG PRO TICKET:\nÜber den Watch-Button im Ticket können Sie entscheiden:\n• Trotzdem weiter folgen (Following)\n• Komplett stummschalten (Muted)\n\n💡 TIPP: Hilfreich bei Team-Übergaben und um den Überblick zu behalten, welche Tickets nicht mehr in Ihrer Verantwortung liegen."
        ticket_blocker: "⚠️ KRITISCH - BETRIFFT ALLE TICKETS!\n\n🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Wenn IRGENDEIN Ticket als Blocker markiert wird\n• Wenn die Priorität auf 'Critical' gesetzt wird\n• Gilt für ALLE Projekte mit Zugriff - nicht nur Ihre Tickets!\n\n⚙️ FEINSTEUERUNG PRO TICKET:\n• Nur über 'Muted' im Ticket-Header deaktivierbar\n• Muted überschreibt auch diese kritischen Alerts\n\n⚠️ WARNUNG: Diese Einstellung erzeugt potentiell VIELE Benachrichtigungen, da sie für alle Tickets in all Ihren Projekten gilt!"
        ticket_status_changed: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Bei Statusänderungen Ihrer zugewiesenen Tickets\n• Bei Statusänderungen von Tickets denen Sie folgen\n• Beispiele: 'Open' → 'In Progress' → 'Review' → 'Done'\n\n⚙️ FEINSTEUERUNG PRO TICKET:\n• Watch-Button: Following für normale Updates\n• Watch-Button: Live Updates für sofortige Benachrichtigung\n• Watch-Button: Muted zum Stummschalten\n\n💡 TIPP: Bei vielen Tickets empfiehlt sich 'Daily Digest' statt 'Immediate', um nicht überflutet zu werden."
        ticket_commented: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Neue Kommentare in Tickets die Sie erstellt haben\n• Neue Kommentare in Tickets die Ihnen zugewiesen sind\n• Neue Kommentare in Tickets denen Sie aktiv folgen\n• Antworten auf Ihre eigenen Kommentare\n\n⚙️ FEINSTEUERUNG PRO TICKET:\n• Watch-Button auf 'Muted' = keine Kommentar-Benachrichtigungen\n• Watch-Button auf 'Live Updates' = sofort bei jedem Kommentar\n\n💡 EMPFEHLUNG: Bei hohem Ticket-Volumen 'Daily Digest' wählen. Sie erhalten dann eine tägliche Zusammenfassung aller Kommentare."
        document_added: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Neue Dokumente in Ihren Projekten\n• Neue Versionen bestehender Dokumente\n• Wichtige Anhänge und Dateien\n\n⚙️ FEINSTEUERUNG:\n• Aktuell nur global steuerbar\n• Projekt-spezifische Einstellungen kommen später\n\n💡 TIPP: Wichtig um keine Spezifikationen, Designs oder Dokumentationen zu verpassen."
        mention: "🚧 FEATURE IN ENTWICKLUNG\n\nDiese Funktion wird Sie benachrichtigen wenn:\n• Sie mit @IhrName in Kommentaren erwähnt werden\n• Jemand Sie direkt anspricht\n• Sie in eine Diskussion einbezogen werden\n\n⏳ STATUS: Die @-Mention Erkennung wird derzeit implementiert und bald verfügbar sein."
        project_announcement: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Wichtige Projektankündigungen\n• Release-Informationen\n• Deadline-Änderungen\n• Team-Meeting Einladungen\n\n⚙️ WICHTIG:\n• Meist zeitkritische Informationen\n• Betrifft alle Projektmitglieder\n\n💡 TIPP: Diese sollten Sie nicht deaktivieren, da sie oft wichtige organisatorische Informationen enthalten."
        system_message: "🔔 WANN SIE BENACHRICHTIGT WERDEN:\n• Geplante Wartungsarbeiten\n• Neue Features und Updates\n• Wichtige Systemänderungen\n• Sicherheitsupdates\n\n⚙️ HÄUFIGKEIT:\n• Sehr selten (1-2x pro Monat)\n• Nur wirklich wichtige Informationen\n\n💡 TIPP: Sollte aktiv bleiben, da diese Nachrichten Ihre Arbeit beeinflussen können."
