---
de:
  devise:
    confirmations:
      confirmed: Deine E-Mail-Adresse wurde erfolgreich bestätigt.
      send_instructions: In wenigen Minuten erhältst du eine E-Mail mit einem Link zur Bestätigung deiner E-Mail-Adresse.
      send_paranoid_instructions: Falls deine E-Mail-Adresse in unserer Datenbank existiert, erhältst du in wenigen Minuten eine E-Mail mit einem Link zur Bestätigung deiner E-Mail-Adresse.
    failure:
      already_authenticated: Du bist bereits angemeldet.
      account_deactivated: Dein Konto wurde deaktiviert. Bitte wende dich an deine Administration.
      inactive: Dein Konto ist nicht aktiviert.
      invalid: Ungültige E-Mail oder Passwort.
      last_attempt: Du hast noch einen Versuch, bevor dein Konto gesperrt wird.
      locked: Dein Konto ist gesperrt.
      not_found_in_database: Ungültige E-Mail oder Passwort.
      timeout: Deine Sitzung ist abgelaufen. Bitte melde dich erneut an.
      unauthenticated: Du musst dich anmelden oder registrieren, bevor du fortfahren kannst.
      unconfirmed: Du musst deine E-Mail-Adresse bestätigen, bevor du fortfahren kannst.
    mailer:
      confirmation_instructions:
        subject: Bestätige deine E-Mail-Adresse
      email_changed:
        subject: E-Mail-Adresse geändert
      password_change:
        subject: Passwort geändert
      reset_password_instructions:
        subject: Anleitung zum Zurücksetzen deines Passworts
      unlock_instructions:
        subject: Anleitung zum Entsperren deines Kontos
