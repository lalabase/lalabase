# Was von der Doku-Oberflaeche im Kern geblieben ist (doc/docs_delivery_plan.md, D5).
#
# Die oeffentliche Dokumentation ist ein eigenes Programm
# (gboyke/lalabase-documentation) und bringt ihre eigenen Texte mit. Hier stehen
# nur noch die zwei Stellen, die die In-App-Hilfe selbst rendert:
#
#   docs.chrome.copy / .copied   -> die Beschriftungen des Kopier-Knopfes an einem
#                                   Codeblock. Das Markup kommt aus dem Katalog,
#                                   die Woerter setzt help/_page.html.erb in den
#                                   Stimulus-Controller.
#   docs.contextual_help.*       -> die 49 Fragen der Kontexthilfe. Die KARTE dazu
#                                   ist Docs::ContextualHelp; `rake anchors:check`
#                                   drueben prueft, ob ihre Anker noch antworten.
#
# Der Dateiname ist geblieben, weil die Schluessel `docs.*` heissen und in der
# Karte, in beiden Sprachdateien und in der Hilfe-View stehen; sie umzubenennen
# waere Bewegung ohne Gewinn.
