# What is left of the documentation chrome in the core (doc/docs_delivery_plan.md, D5).
#
# The public documentation is its own program (gboyke/lalabase-documentation) and
# brings its own text. Only the two places the in-app help renders itself stay:
#
#   docs.chrome.copy / .copied   -> the labels of the copy button on a code block.
#                                   The markup comes from the catalogue; the words
#                                   are handed to the Stimulus controller by
#                                   help/_page.html.erb.
#   docs.contextual_help.*       -> the 49 contextual help questions. Their MAP is
#                                   Docs::ContextualHelp, and `rake anchors:check`
#                                   over there tests that its anchors still answer.
#
# The file name stayed because the keys are `docs.*` and they are spelled out in
# the map, in both locale files and in the help view; renaming them would be
# movement without gain.
