  # English sentence joining for Array#to_sentence. Rails ships these defaults
  # itself; spelled out to keep the pair with `de.support` symmetric, like number.*.
  support:
    array:
      words_connector: ", "
      two_words_connector: " and "
      last_word_connector: ", and "

  # English number formats. Rails ships these defaults itself, so they are spelled
  # out here only to keep the pair with `de.number` symmetric -- an English tree
  # that exists implicitly and a German one that exists in the file is exactly the
  # asymmetry that let the German UI render "€14.50" unnoticed until 2026-08.
  # The currency unit is EUR in both locales: the product is priced in euros, the
  # locale only decides where the sign sits.
  number:
    format:
      separator: "."
      delimiter: ","
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%u%n"
        unit: "€"
        separator: "."
        delimiter: ","
        precision: 2
    percentage:
      format:
        format: "%n%"
        separator: "."
        delimiter: ","
