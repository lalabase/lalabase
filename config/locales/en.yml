      default: "%Y-%m-%d"
      long: "%B %d, %Y"
      short: "%b %d"
      # The two bounds of a period pill (time list, S7). Their own formats,
      # because the pill carries the year only ONCE, at the end:
      # "01 Jun - 31 Aug 2026". short would have given the start and default
      # the end, but default is ISO here and the mix is unreadable.
      range_start: "%d %b"
      range_bound: "%d %b %Y"
      # Month and year without a day, for period headings (measurement month,
      # M2). Its own format rather than short: short carries NO year, and a
      # billing period without one is ambiguous the moment January comes round.
      month_year: "%B %Y"
