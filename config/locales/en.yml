  services:
    extract_plain_text:
      errors:
        file_read_error: 'Error reading %{file_type} file: %{message}'
    notifications:
      preferences:
        help:
          ticket_assigned: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When a ticket is assigned to you
            • When you're added as a co-assignee
            • When assignment to you is changed
            
            ⚙️ FINE-TUNING PER TICKET:
            You can override this setting for individual tickets:
            → In the ticket header with the Watch button (4 modes available)
            → Watch = Default notifications (these settings)
            → Following = Follow important updates
            → Live Updates = ALL updates immediately
            → Muted = Completely silent (even for assignments!)
            
            💡 TIP: Use "Immediate" for critical projects where you need to react quickly. For less important projects, "Daily digest" is often sufficient.
          ticket_unassigned: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When your assignment is removed from a ticket
            • When you're removed as a co-assignee
            • When a ticket becomes completely unassigned
            
            ⚙️ FINE-TUNING PER TICKET:
            Override with the Watch button in ticket header:
            → Muted = No notification, even for unassignment
            → Live Updates = Immediate notification for every change
            
            💡 TIP: Enable this notification to ensure no tickets get "lost" when assignments are removed.
          ticket_blocker: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When a ticket is marked as blocker
            • When priority changes to critical/blocking
            • When a critical issue prevents work
            
            ⚙️ FINE-TUNING PER TICKET:
            Use the Watch button to treat individual tickets differently:
            → Live Updates = Get informed about blockers immediately
            → Muted = Even critical blockers are ignored (Caution!)
            
            ⚠️ IMPORTANT: Blockers often affect multiple team members. Think carefully before disabling these notifications. A missed blocker can hold up the entire team!
          ticket_commented: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When someone adds a comment to a ticket
            • When discussions happen in tickets
            • For questions or answers on tickets
            
            ⚙️ FINE-TUNING PER TICKET:
            Individual control via Watch button:
            → Following = Only important comments
            → Live Updates = See every comment immediately
            → Muted = No comment notifications
            
            💡 TIP: "Daily digest" is ideal for normal projects. For active discussions, you can temporarily switch to "Live Updates" for the specific ticket.
          document_added: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When new documents are added to a project
            • When files are uploaded or linked
            • For important document updates
            
            ⚙️ FINE-TUNING PER TICKET:
            For ticket-related documents, controllable via Watch button:
            → Following = Only important documents
            → Muted = No document notifications
            
            💡 TIP: Useful for projects with frequent document updates. Weekly digest is often enough unless you're actively working with the documents.
          ticket_status_changed: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When a ticket's status changes
            • For progress from "Open" to "In Progress" to "Done"
            • For regressions or reopenings
            
            ⚙️ FINE-TUNING PER TICKET:
            Control individual tickets with Watch button:
            → Live Updates = Every status change immediately
            → Following = Only important status changes
            → Muted = No status updates
            
            💡 TIP: Often set to "Immediate" for project managers. Developers usually prefer "Daily digest" to avoid constant interruptions.
          mention: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • When you're mentioned with @YourName
            • In comments, descriptions, or discussions
            • Direct addressing that requires your attention
            
            ⚙️ FINE-TUNING PER TICKET:
            WARNING: Muted tickets block @-mentions too!
            → Watch/Following/Live = @-mentions come through
            → Muted = BLOCKS direct @-mentions too
            
            ⚠️ IMPORTANT: This setting should almost always be on "Immediate"! @-mentions are direct communication and usually expect a timely response.
          system_message: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • Important system announcements
            • Maintenance and downtime notices
            • Security updates and critical information
            
            ⚙️ FINE-TUNING:
            System messages are global and cannot be controlled per ticket.
            
            ⚠️ IMPORTANT: We recommend keeping these notifications enabled. You'll only receive important system-wide information, no spam messages.
          project_announcement: |
            🔔 WHEN YOU'LL BE NOTIFIED:
            • Announcements from the project manager
            • Important project updates and milestones
            • Team-wide information and deadlines
            
            ⚙️ FINE-TUNING:
            Applies to all tickets in a project. Individual tickets can be handled differently via Watch button.
            
            💡 TIP: "Weekly digest" is often sufficient for general announcements. For time-critical projects, choose "Immediate" or "Daily".
      fanout:
        errors:
          processing_failed: 'Notification processing failed: %{message}'
      update_preferences:
        errors:
          organisation_required: Organisation required
          update_failed: 'Failed to update preferences: %{message}'
          user_required: User required
    preferences:
      help:
        ticket_assigned: "🔔 WHEN YOU'LL BE NOTIFIED:\n• When a ticket is assigned to you\n• When you're added to an existing ticket\n• When an automated workflow assigns you\n• When a ticket is delegated to your team\n\n⚙️ FINE-TUNING PER TICKET:\nYou can customize notifications for each individual ticket:\n• Use the Watch button in the ticket header\n• 4 modes: Watch → Following → Live Updates → Muted\n• 'Muted' overrides ALL global settings\n\n💡 TIP: These notifications are critical for your work and should normally stay active."
        ticket_unassigned: "🔔 WHEN YOU'LL BE NOTIFIED:\n• When you're removed from a ticket\n• When assignment is changed\n• When a ticket is reassigned\n\n⚙️ FINE-TUNING PER TICKET:\nVia the Watch button in the ticket you can:\n• Continue following anyway (Following)\n• Completely mute (Muted)\n\n💡 TIP: Helpful during team handovers and to keep track of which tickets are no longer your responsibility."
        ticket_blocker: "⚠️ CRITICAL - AFFECTS ALL TICKETS!\n\n🔔 WHEN YOU'LL BE NOTIFIED:\n• When ANY ticket is marked as blocker\n• When priority is set to 'Critical'\n• Applies to ALL projects you have access to - not just your tickets!\n\n⚙️ FINE-TUNING PER TICKET:\n• Only deactivatable via 'Muted' in ticket header\n• Muted overrides even these critical alerts\n\n⚠️ WARNING: This setting potentially generates MANY notifications as it applies to all tickets in all your projects!"
        ticket_status_changed: "🔔 WHEN YOU'LL BE NOTIFIED:\n• Status changes of your assigned tickets\n• Status changes of tickets you follow\n• Examples: 'Open' → 'In Progress' → 'Review' → 'Done'\n\n⚙️ FINE-TUNING PER TICKET:\n• Watch button: Following for normal updates\n• Watch button: Live Updates for immediate notification\n• Watch button: Muted to silence\n\n💡 TIP: For many tickets, 'Daily Digest' is recommended over 'Immediate' to avoid being overwhelmed."
        ticket_commented: "🔔 WHEN YOU'LL BE NOTIFIED:\n• New comments in tickets you created\n• New comments in tickets assigned to you\n• New comments in tickets you actively follow\n• Replies to your own comments\n\n⚙️ FINE-TUNING PER TICKET:\n• Watch button on 'Muted' = no comment notifications\n• Watch button on 'Live Updates' = immediately for every comment\n\n💡 RECOMMENDATION: For high ticket volume choose 'Daily Digest'. You'll receive a daily summary of all comments."
        document_added: "🔔 WHEN YOU'LL BE NOTIFIED:\n• New documents in your projects\n• New versions of existing documents\n• Important attachments and files\n\n⚙️ FINE-TUNING:\n• Currently only globally controllable\n• Project-specific settings coming later\n\n💡 TIP: Important to not miss specifications, designs, or documentation."
        mention: "🚧 FEATURE IN DEVELOPMENT\n\nThis feature will notify you when:\n• You're @mentioned in comments\n• Someone addresses you directly\n• You're included in a discussion\n\n⏳ STATUS: @mention detection is currently being implemented and will be available soon."
        project_announcement: "🔔 WHEN YOU'LL BE NOTIFIED:\n• Important project announcements\n• Release information\n• Deadline changes\n• Team meeting invitations\n\n⚙️ IMPORTANT:\n• Usually time-critical information\n• Affects all project members\n\n💡 TIP: You shouldn't deactivate these as they often contain important organizational information."
        system_message: "🔔 WHEN YOU'LL BE NOTIFIED:\n• Scheduled maintenance\n• New features and updates\n• Important system changes\n• Security updates\n\n⚙️ FREQUENCY:\n• Very rare (1-2x per month)\n• Only really important information\n\n💡 TIP: Should stay active as these messages can affect your work."
