              # fact: the tier credential can no longer serve chat (disabled,
              # purpose changed or endpoint removed — usable_for?). The factory
              # seam then refuses to route rather than quietly falling back to the
              # provider default, so the choice must not be written in the first
              # place. The text deliberately names none of the three causes: only
              # the operator can fix them, not the customer.
              tier_credential_unusable: "The %{key} tier is currently unavailable — its stored credentials cannot serve it."
