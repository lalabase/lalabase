        title: Neue Organisation anlegen
        subtitle: Erstellen Sie eine neue Organisation und werden Sie automatisch Administrator.
        back_to_selection: Zurück zur Organisationsauswahl
      select:
        # E10: Einstieg in den Rechnungsbereich direkt von der Kachel aus.
        title: Organisation auswählen
        subtitle: Wählen Sie eine Organisation oder erstellen Sie eine neue.
        member_count:
          one: "%{count} Mitglied"
          other: "%{count} Mitglieder"
        new_organisation: Neue Organisation
        new_organisation_modal_title: Neue Organisation anlegen
        info_title: Organisation & Projekte
        info_paragraph_1: Organisationen sind die oberste Ebene in Lalabase. Innerhalb einer Organisation können Sie Projekte erstellen und verwalten.
        info_paragraph_2: Jedes Projekt bietet Ihnen Aufgabenverwaltung, Dokumentenmanagement und KI-gestützte Suche.
        info_paragraph_3: Laden Sie Teammitglieder ein und arbeiten Sie gemeinsam in Echtzeit.
        logout: Abmelden
