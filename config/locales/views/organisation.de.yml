          override_notice: 'Wichtig: Projekt-spezifische Rechte überschreiben Rollen-basierte Rechte!'
          removing_title: Jemanden aus dem Projekt nehmen
          removing_intro: '„Entfernen“ bedeutet immer dasselbe: Diese Person soll hier nicht mehr arbeiten. Wie das umgesetzt wird, hängt davon ab, woher ihr Zugriff kommt.'
          removing_plain_title: Ohne Rollenrecht
          removing_plain_description: Das Projektrecht wird gelöscht. Die Person verschwindet aus der Liste und steht wieder unter „Mitglied hinzufügen“.
          removing_blocked_title: Mit Rollenrecht
          removing_blocked_description: Löschen würde nichts bringen, weil die Rolle den Zugriff sofort wieder erlaubt. Stattdessen wird ein Projektrecht mit „Kein Zugriff“ gesetzt, das die Rolle aushebelt. Die Zeile bleibt sichtbar und ist mit „Gesperrt“ markiert. „Sperre aufheben“ macht das rückgängig, danach gilt wieder, was die Rolle erlaubt.
          removing_admin_notice: 'Ausnahme: Ein Account-Admin hat Zugriff auf alle Projekte, und kein Projektrecht kann das überschreiben. Hier hilft nur, die Rolle zu ändern.'
