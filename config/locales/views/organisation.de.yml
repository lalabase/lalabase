          overview_intro: 'Die Rechteverwaltung in Lalabase erfolgt auf drei Ebenen:'
          level_admin_title: 1. Account-Admin
          level_admin_description: Hat vollen Zugriff auf alle Projekte und Funktionen der Organisation.
          level_role_title: 2. Rollen-basiert
          level_role_description: Globale Rechte über die Rolle des Benutzers in der Organisation.
          level_project_title: 3. Projekt-spezifisch
