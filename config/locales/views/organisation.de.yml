          time_self_cannot: Benutzer können ihre eigenen TimeSession-Rechte NICHT ändern
          faq_title: Häufige Fragen
          faq_q1: Warum sehe ich bei manchen Bereichen keine Buttons?
          faq_a1: Bei TimeSession-Berechtigungen werden statt Buttons die tatsächlichen Rechte als Text angezeigt. Nicht vorhandene Rechte sind durchgestrichen.
          faq_q2: Was bedeutet "modifiziert" bei einer Rolle?
          faq_a2: Dies zeigt an, dass die Projekt-spezifischen Rechte von den Standard-Rechten der Rolle abweichen.
          faq_q3: Kann ich einem Benutzer nur Leserechte für TimeSessions geben, aber keine Erstellungsrechte?
          faq_a3: Ja! Über die erweiterten TimeSession-Einstellungen können Sie genau festlegen, welche Aktionen erlaubt sind.
          faq_q4: Was passiert, wenn ich einem Benutzer alle Rechte entziehe?
          faq_a4: Der Benutzer wird aus der Projektmitgliederliste entfernt und hat keinen Zugriff mehr auf das Projekt.
          faq_q5: Was passiert mit den Rechten, wenn ein Benutzer die Rolle wechselt?
          faq_a5: Die Rollen-basierten Rechte werden automatisch angepasst. Projekt-spezifische Rechte bleiben jedoch unverändert, da sie die Rollen-Rechte überschreiben.
          faq_q6: Kann ich Rechte-Vorlagen erstellen oder Rechte von einem Benutzer auf einen anderen kopieren?
          faq_a6: Derzeit gibt es keine Vorlagen-Funktion. Sie müssen die Rechte für jeden Benutzer individuell einstellen. Dies stellt sicher, dass Rechte bewusst und gezielt vergeben werden.
          faq_q7: Wie kann ich sehen, welche Rechte aus der Rolle kommen und welche projekt-spezifisch sind?
          faq_a7: Wenn Projekt-Rechte von den Rollen-Rechten abweichen, erscheint "(modifiziert)" neben der Rolle. Im Bearbeitungsmodus können Sie durch Klick auf das Info-Symbol die Rollen-Rechte einblenden.
          faq_q8: Gibt es eine Übersicht, wer in allen meinen Projekten welche Rechte hat?
          faq_a8: Die Rechteverwaltung erfolgt pro Projekt. Für eine organisationsweite Übersicht müssten Sie jedes Projekt einzeln prüfen. Account-Admins haben automatisch vollen Zugriff auf alle Projekte.
          faq_q9: Was passiert mit TimeSessions, wenn ich einem Benutzer nachträglich die Rechte entziehe?
          faq_a9: Bereits erstellte TimeSessions bleiben bestehen. Der Benutzer kann sie je nach neuen Rechten möglicherweise nicht mehr sehen oder bearbeiten. Die Daten werden nicht gelöscht, nur der Zugriff wird eingeschränkt.
