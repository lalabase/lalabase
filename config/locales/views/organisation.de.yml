      invitation_mailer:
        invite_email:
          greeting: Hallo,
          intro: "%{first_name} %{last_name} hat dich eingeladen, Teil der Organisation zu werden."
          link_instruction: 'Klicke auf den folgenden Link, um die Einladung anzunehmen:'
