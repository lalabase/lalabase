        show:
          # Was hier NICHT mehr steht: die Strings des alten Anbieter-Formulars
          # (System-/eigene Credentials, API-Key-Feld, Sicherheitshinweis, „Eigene
          # Konfiguration“ …). Das Formular ist mit S7 auf die eigene Seite gezogen und
          # hat seine Schlüssel unter views.organisations.ai_overview.configuration.*
          # neu bekommen; die 27 Schlüssel hier blieben ohne einen einzigen Leser
          # zurück. Ein Schlüssel ohne Leser ist keine Reserve, sondern eine Behauptung
          # über eine Oberfläche, die es nicht gibt.
          test_connection: Verbindung testen
          # Der Schalter wohnt seit dem Umbau auf der Übersicht (doc/ki_zugang_umbau_plan.md
          # D1/D5). Was hier stand — Statusüberschrift, „aktiviert am X durch Y", der
          # Einwilligungs-Langtext und die beiden Schalter-Beschriftungen — ist mit ihm
          # umgezogen und steht jetzt unter views.organisations.ai_overview.activation.*.
          # Zurück bleibt eine Zeile Orientierung mit Link, ohne eigene Daten: keine
          # zweite Wahrheit über einen Zustand, den die Übersicht vollständig beschreibt.
          status_line_active_html: KI-Features sind aktiv. Ein- und ausgeschaltet wird auf der %{link}.
          status_line_inactive_html: KI-Features sind nicht aktiviert. Den Zugang können Sie hier schon vorbereiten, aktiviert wird auf der %{link}.
          status_line_overview_link: Übersicht
        # KI-Pakete §7/§7.1: Kartenkatalog samt Zwei-Filter. Der Block spannt
        # show.html.erb und die _package_*-Partials — daher ein eigener,
        # partial-übergreifender Besitzer (Muster: views.admin.ai_credentials.seam).
        packages:
          title: KI-Paket
          intro: Ein Paket legt fest, welcher Anbieter Chat und Suche Ihrer Organisation verarbeitet und in welchem Rechtsraum das geschieht.
          current_label_package: "Aktuell: %{name} — %{description}"
          current_label_custom: "Aktuell: Eigene Konfiguration"
          current_custom_hint: Es gelten die eigenen Zugangsdaten der Organisation, hinterlegt unter „Eigene Konfiguration".
          # doc/ki_zugang_umbau_plan.md D7, Zustand Z3: weder Paket noch eigene
          # Zugangsdaten. Hier stand bis zum Umbau „Aktuell: Eigene Konfiguration" — eine
          # Entscheidung, die niemand getroffen hatte. Der Text sagt jetzt, was zutrifft,
          # und nennt beide Wege, statt einen zu behaupten.
          none_configured_title: Noch kein KI-Zugang eingerichtet
          none_configured_hint: Wählen Sie ein Systempaket oder hinterlegen Sie eigene Zugangsdaten. Bis dahin steht keiner der beiden Wege zur Verfügung.
          # doc/ki_zugang_umbau_plan.md D6: die Entweder-oder-Frage als zwei Kacheln.
          # `active_chip` sagt, welcher Weg GILT — welcher Weg gerade GEÖFFNET ist, sagt
          # der Auswahlrahmen. Zwei Aussagen, zwei Träger: sonst sähe ein Blick auf den
          # anderen Weg wie ein bereits vollzogener Wechsel aus.
          chooser:
            packages_title: Systempaket
            packages_subline: Kuratierte Pakete mit geprüftem Rechtsraum und Verarbeitungsort.
            custom_title: Eigene Konfiguration
            custom_subline: Eigene API-Schlüssel und Anbieter-Einstellungen dieser Organisation.
            active_chip: Aktiv
          # P4c (E1): der Zustand eines laufenden Paketwechsels, direkt unter der
          # „Aktuell“-Zeile. Die Schlüssel heißen wie die Zustände in
          # Embeddings::SwitchProgress::STATES — wer dort einen Zustand ergänzt,
          # findet hier die Lücke, statt sie zu übersehen.
          progress:
            building_title: Umstellung der Suche läuft
            building_body: "Noch %{remaining} von %{total} Datensätzen — %{percent} % sind im neuen Suchindex."
            awaiting_flip_title: Neuaufbau abgeschlossen
            awaiting_flip_body: Der neue Suchindex ist vollständig. Er wird in der Regel innerhalb einer Viertelstunde automatisch aktiv — Sie müssen nichts tun.
            paused_title: Umstellung pausiert
            paused_body: Ihr KI-Kontingent für diesen Monat ist aufgebraucht, deshalb ruht der Neuaufbau. Er wird automatisch fortgesetzt, sobald das Kontingent im nächsten Monat zurückgesetzt wird.
            # Kein Fortschritt, sondern ein Halt: der Zielraum ist vollständig, aber
            # aus dem Index genommen. Ein Neuaufbau repariert das NICHT (er fände
            # nichts zu tun), es braucht die Reaktivierung durch den Betreiber —
            # deshalb nennt der Text keine Wartezeit, sondern eine Zuständigkeit.
            retired_target_title: Umstellung steht
            retired_target_body: Der Zielindex ist vollständig, aber derzeit nicht in Benutzung. Das löst sich nicht von selbst — bitte wenden Sie sich an den Systemadministrator. Ihre Suche arbeitet währenddessen unverändert weiter.
            # EINE Suchzeile: jeder Zustand, der die Anzeige erreicht, hat einen
            # aufgelösten Zeiger, also bedient der alte Index bis zum Umschalten weiter.
            # Die frühere zweite Variante für zeigerlose Orgs ist entfallen — sie hätte
            # jede gesunde Org mitgewarnt (Review-Blocker 1).
            search_kept: Ihre bestehenden Inhalte bleiben währenddessen auffindbar — die Suche liest bis zum Abschluss aus dem bisherigen Index. Inhalte, die in dieser Zeit neu entstehen, sind erst danach durchsuchbar.
          # P4c (E5): das eigene Paket steht nicht im Raster — zwei Wege dorthin mit
          # ungleichem Ausgang.
          outside_grid:
            filtered_title: Ihr aktuelles Paket wird von den Filtern ausgeblendet
            filtered_body: Es erfüllt die oben eingestellten Kriterien nicht. Die Karte steht trotzdem hier, damit Sie Ihre Leistungsstufe umstellen können. Lockern Sie die Filter, um es wieder im Katalog zu sehen.
            withdrawn_title: Ihr aktuelles Paket wird nicht mehr angeboten
            withdrawn_body: Der Betreiber hat dieses Paket zurückgezogen. Für Sie läuft es unverändert weiter, die Leistungsstufe lässt sich aber nicht mehr umstellen. Wählen Sie dafür unten ein anderes Paket oder „Eigene Konfiguration“.
          filters:
            heading: Auswahl eingrenzen
            hint: Voreingestellt ist die strengste Kombination. Jede Lockerung ist eine bewusste Entscheidung.
            provider: Anbieter
            provider_eu: EU-Unternehmen
            provider_any: auch außereuropäische Unternehmen
            processing: Verarbeitung
            processing_eu: nur in der EU
            processing_any: auch außerhalb der EU
          jurisdictions:
            blank: Keine Angabe
            eu_native: Europäisch
            eu_region_foreign_provider: EU-Region, außereuropäischer Anbieter
            eu_provider_foreign_region: EU-Anbieter, Drittland-Region
            non_eu: Außerhalb der EU
            self_hosted: Eigener Server
          # Der einschränkende Zusatz aus §7, bewusst in derselben Schriftgröße wie
          # die Beschreibung. `eu_native` hat KEINEN Eintrag: es ist die einzige
          # Stufe ohne Drittlandübermittlung (§3.1). Dass jede andere Stufe einen
          # Zusatz trägt, erzwingt ein Spec — sonst fiele eine neu ergänzte Stufe
          # stillschweigend in den harmlos aussehenden Zustand.
          jurisdiction_notes:
            eu_region_foreign_provider: Die Verarbeitung findet in der EU statt, der Anbieter ist aber ein außereuropäisches Unternehmen und untersteht dem Recht seines Sitzlandes. Das gilt rechtlich als Drittlandübermittlung.
            eu_provider_foreign_region: Der Anbieter ist ein europäisches Unternehmen, die Daten werden aber außerhalb der EU verarbeitet. Ihre Daten verlassen damit die EU.
            non_eu: Anbieter und Verarbeitung liegen außerhalb der EU. Ihre Daten verlassen damit die EU.
            self_hosted: Die Verarbeitung läuft auf einem selbst betriebenen Server. Verantwortlich dafür ist der Betreiber dieser Installation, nicht ein externer Anbieter.
          # T5: der zweite Badge. Der STRENGSTE Wert der beteiligten Zugangsdaten —
          # ein Paket ist nur so gut wie sein schwächstes Credential. `self_hosted`
          # hat keinen Eintrag und braucht keinen: dort rendert die Karte gar
          # keinen Badge, weil die Frage gegenstandslos ist.
          training_usages:
            excluded: Kein Training
            used: Training durch den Anbieter
            unspecified: Training nicht zugesichert
          # Zusatz zu jedem Wert AUSSER dem unbedenklichen — dieselbe Regel wie bei
          # den Rechtsraum-Stufen, und aus demselben Grund per Guard-Spec erzwungen:
          # eine fehlende Angabe liest sich als Entwarnung.
          training_notes:
            used: Der Anbieter nutzt Inhalte, die Sie über die KI-Funktionen verarbeiten lassen, zum Training seiner Modelle.
            unspecified: Für dieses Paket liegt uns keine vertragliche Zusage zum Modelltraining vor. Das heißt nicht, dass trainiert wird — es heißt, dass wir es nicht belegen können.
          # Die dritte Aussage steht als Satz statt als Badge (E1). Anders als beim
          # Rechtsraum trägt hier AUCH der gute Wert einen Satz: die Achse hat keinen
          # eigenen Badge, ohne Satz bliebe „wird nicht gespeichert" unsichtbar.
          retention_notes:
            none: Ihre Inhalte werden beim Anbieter nicht gespeichert.
            limited:
              one: Ihre Inhalte werden beim Anbieter bis zu einen Tag gespeichert.
              other: Ihre Inhalte werden beim Anbieter bis zu %{count} Tage gespeichert.
            unlimited: Der Anbieter speichert Ihre Inhalte ohne zugesicherte Frist.
            unspecified: Für dieses Paket liegt uns keine vertragliche Zusage zur Speicherdauer vor.
          card:
            processing_region: "Verarbeitungsort: %{region}"
            tiers_heading: Enthaltene Stufen
            # Dieselbe Staffel, zwei Lesarten: auf einer fremden Karte
            # beschreibt sie das Paket, auf der gewählten ist sie der
            # Umschalter (§7).
            tier_switch_heading: Leistungsstufe
            tier_provider_missing: Anbieter noch nicht hinterlegt
            tier_unavailable: Zugangsdaten deaktiviert — derzeit nicht wählbar
            # P4c (E5): ein ANDERER Grund als tier_unavailable und deshalb ein eigener
            # Text. Die Stufe ist nicht kaputt — der Chat dahinter läuft, die Org sitzt
            # auf einer davon —, das Paket wird nur nicht mehr angeboten. „Zugangsdaten
            # deaktiviert“ hier zu recyceln schickte den Kunden zu den Credentials statt
            # zum Paket.
            tier_withdrawn: Paket wird nicht mehr angeboten — Stufe nicht umstellbar
            tier_utility_hint: Hilfsaufgaben — Teilnehmererkennung, Zusammenfassungen von Tickets und Dokumenten, Ticket-Vorschläge und die Indexierung angebundener Repositories — laufen unabhängig davon immer auf „%{tier}“. Der Rechtsraum ändert sich dadurch nicht.
            # Dieselbe Aussage mit umgekehrtem Vorzeichen: die Hilfsaufgaben laufen
            # weiterhin auf dieser Stufe — nur kann die gerade nicht bedienen. Ohne
            # eigenen Text verspricht der Hinweis oben fuenf Funktionen, die alle
            # stillstehen, und zwar genau dann, wenn der Kunde eine ANDERE Stufe
            # gewaehlt hat und sein Chat weiterlaeuft.
            tier_utility_unavailable: Hilfsaufgaben — Teilnehmererkennung, Zusammenfassungen von Tickets und Dokumenten, Ticket-Vorschläge und die Indexierung angebundener Repositories — laufen immer auf „%{tier}“. Die Zugangsdaten dieser Stufe sind derzeit deaktiviert, diese Funktionen stehen deshalb nicht zur Verfügung — auch wenn Sie eine andere Stufe gewählt haben. Bitte wenden Sie sich an den Systemadministrator.
            provider_note_summary: Was der Anbieter vertraglich mit den Daten tut
            selected_badge: Gewählt
            select_button: Dieses Paket wählen
            selected_button: Aktuell gewählt
            # P4b: aus der Absage wurde ein Umweg. Der Wechsel ist möglich, führt
            # aber über den Konsequenzen-Dialog (#confirm_package) statt über
            # einen nackten Knopf.
            switch_notice: Dieses Paket nutzt einen anderen Suchindex als Ihr aktuelles. Vor dem Wechsel zeigen wir Ihnen, was sich rechtlich ändert, was der Neuaufbau der Suche kostet und was in der Zwischenzeit mit Ihrer Suche passiert.
            switch_button: Wechsel prüfen
            # Zweite Absage-Tuer derselben Karte (P3): die Stufe, auf der eine frische
            # Auswahl landet, hat keine nutzbaren Zugangsdaten. Eigener Text, weil es
            # weder um den Rechtsraum noch um den Suchindex geht.
            selection_blocked: Dieses Paket ist derzeit nicht wählbar — die Zugangsdaten seiner Standard-Stufe sind deaktiviert. Bitte wenden Sie sich an den Systemadministrator.
            selection_blocked_button: Derzeit nicht wählbar
          empty:
            title: Kein Paket erfüllt beide Kriterien
            hint_provider: Auf „auch außereuropäische Unternehmen“ gestellt, zeigt der Anbieter-Filter mindestens ein Paket.
            hint_processing: Auf „auch außerhalb der EU“ gestellt, zeigt der Verarbeitungs-Filter mindestens ein Paket.
            hint_both: Jeder der beiden Filter zeigt einzeln gelockert mindestens ein Paket — lockern Sie den, der für Sie weniger wiegt.
            hint_relax_both: Erst wenn Sie beide Filter lockern, erscheint ein Paket — einzeln reicht keine der beiden Lockerungen.
            hint_none: Derzeit ist kein Paket veröffentlicht. Bitte wenden Sie sich an den Systemadministrator.
          custom:
            title: Eigene Konfiguration
            description: Kein kuratiertes Paket, sondern die eigenen Anbieter-Einstellungen dieser Organisation — inklusive eigener API-Schlüssel.
            note: Rechtsraum und Verarbeitungsort verantworten Sie damit selbst; sie stehen in keinem Paket-Text.
            # Der Rückweg ist derselbe Wechsel wie der Hinweg und nimmt denselben
            # Umweg — eigener Text, weil die Richtung eine andere ist.
            switch_notice: Zurück zur eigenen Konfiguration würde Ihre Inhalte mit einem anderen Modell durchsuchen. Auch dieser Wechsel führt zuerst über die Übersicht der Konsequenzen.
            select_button: Eigene Konfiguration nutzen
            selected_badge: Gewählt
            # S7: die Karte war bis dahin die WAHL ohne etwas dahinter — die
            # EINRICHTUNG war ein zweites Formular auf derselben Seite. Diese Zeile
            # ist die Tür, die §3.4 von Anfang an vorsah.
            configure_link: Zugangsdaten einrichten
            access_present: "Hinterlegt: eigener Zugang für %{provider}."
            access_failed: Der letzte Verbindungstest ist fehlgeschlagen.
            # D7: die Abwesenheit als Aussage. Vorher stand hier nichts, ausgerechnet im
            # Zustand mit dem größten Erklärungsbedarf. `not_ready_hint` kommt zusätzlich,
            # wenn dieser Weg GILT und trotzdem nichts dahintersteht.
            not_configured: Noch keine Zugangsdaten hinterlegt.
            not_ready_hint: Ohne hinterlegte Zugangsdaten können die KI-Funktionen nicht arbeiten. Richten Sie den Zugang ein oder wählen Sie ein Systempaket.
          # KI-Pakete P4b (doc/ki_pakete_p4_plan.md §4): der Konsequenzen-Dialog vor
          # einem Wechsel, der den Suchindex bewegt. Eigene Seite statt Modal —
          # Begründung im Kopf von confirm_package.html.erb.
          switch:
            title: Paketwechsel prüfen
            intro: "Sie sind dabei, auf „%{target}“ zu wechseln. Was das bedeutet, steht hier — der Wechsel startet erst, wenn Sie ihn unten bestätigen."
            unavailable: Dieses Paket steht derzeit nicht zur Auswahl.
            tier_unusable: Dieses Paket lässt sich derzeit nicht auswählen — die vorgesehene Leistungsstufe ist nicht verfügbar. Bitte wenden Sie sich an den Betreiber.
            same_lane: Für diese Auswahl ändert sich der Vektorraum der Suche nicht — sie lässt sich direkt in der Übersicht wählen.
            legal_heading: Rechtsraum
            side_today: Heute
            side_after: Nach dem Wechsel
            jurisdiction_unstated: Für diese Konfiguration ist kein Rechtsraum hinterlegt — Rechtsraum und Verarbeitungsort verantworten Sie damit selbst.
            # Vier Fälle, nicht drei: ein Paket, das gar nichts zusichert, darf
            # weder als Verbesserung noch als Verschlechterung gemeldet werden.
            jurisdiction_change:
              unchanged: Der Rechtsraum bleibt unverändert.
              to_eu_native: Mit dem Wechsel entfällt die Drittlandübermittlung — Anbieter und Verarbeitung liegen danach in der EU.
              from_eu_native: Mit dem Wechsel entsteht eine Drittlandübermittlung. Ihre Inhalte werden danach nicht mehr ausschließlich von einem europäischen Unternehmen in der EU verarbeitet.
              changed: Der Rechtsraum ändert sich. Bitte vergleichen Sie die beiden Angaben oben.
              unstated: Zu mindestens einer der beiden Seiten ist kein Rechtsraum hinterlegt — ob sich an der Drittlandübermittlung etwas ändert, lässt sich daraus nicht ableiten. Bitte vergleichen Sie die beiden Angaben oben.
              self_hosted_target: Die Verarbeitung wandert auf einen selbst betriebenen Server. Eine Übermittlung an einen externen Anbieter findet danach nicht mehr statt; verantwortlich für Rechtsraum und Verarbeitungsort ist dann der Betreiber dieser Installation.
              self_hosted_source: Die Verarbeitung verlässt den selbst betriebenen Server und geht an einen externen Anbieter. Bitte prüfen Sie die Angabe zum Rechtsraum oben.
            # T7: dieselbe Bauart wie oben, eine Achse tiefer. Es gibt bewusst
            # KEINEN Eintrag für „eine Seite sagt nichts" — dort rendert die View
            # gar keine Zeile, weil die Rechtsraum-Zeile den Fall schon erklärt
            # (self_hosted oder „Eigene Konfiguration"). Ein Satz an dieser Stelle
            # müsste über die leere Seite etwas behaupten, und genau das war der
            # Defekt, den der #437-Review viermal aus der Nachbarmethode geholt hat.
            training_change:
              unchanged: An der Trainings-Zusage ändert sich nichts.
              to_used: "Achtung: Der neue Anbieter nutzt Ihre Inhalte zum Training seiner Modelle. Bisher war das vertraglich ausgeschlossen."
              to_excluded: Der neue Anbieter schließt die Nutzung Ihrer Inhalte zum Modelltraining vertraglich aus. Bisher war das nicht zugesichert.
              not_comparable: Zu mindestens einer der beiden Seiten liegt keine vertragliche Zusage zum Modelltraining vor — ob sich daran etwas ändert, lässt sich daraus nicht ableiten. Bitte vergleichen Sie die beiden Angaben oben.
            cost_heading: Umfang und Kosten
            cost_estimate: "Die Umstellung umfasst ca. %{records} Datensätze und entspricht schätzungsweise %{credits} Credits."
            cost_estimate_hint: Eine Schätzung, kein Preis — die Tokenmenge ist überschlagen (Abweichung nach oben wie nach unten möglich), und bereits vorhandene Einträge werden übersprungen. Die tatsächliche Abrechnung kann darunter, bei sehr code-lastigen Inhalten auch darüber liegen.
            quota_covered: "Ihr verbleibendes Monatskontingent (%{remaining} Credits) deckt die Umstellung auch mit Sicherheitsaufschlag ab."
            quota_short_title: Die Schätzung übersteigt Ihr verbleibendes Kontingent
            quota_short_body: "Von Ihrem Monatskontingent sind noch %{remaining} Credits übrig. Weil die Schätzung ungenau ist, rechnen wir mit einem Sicherheitsaufschlag von 30 %% — also mit %{planned} Credits, und damit %{shortfall} Credits mehr, als Ihnen bleiben. Wird das Kontingent aufgebraucht, stehen Chat und semantische Suche bis zum nächsten Monatsbeginn nicht mehr zur Verfügung."
            quota_exhausted_title: Ihr Monatskontingent ist aufgebraucht
            quota_exhausted_body: Der Wechsel wird gespeichert, der Neuaufbau beginnt aber erst, wenn im nächsten Monat wieder Kontingent zur Verfügung steht.
            search_heading: Suche während der Umstellung
            search_body: Ihre Inhalte werden im Hintergrund neu für die Suche aufbereitet. Bis das abgeschlossen ist, liefert die Suche unverändert Treffer aus dem bisherigen Index — je nach Anbieter und Datenmenge dauert das Minuten bis Stunden.
            search_body_hard: Ihre Inhalte werden im Hintergrund neu für die Suche aufbereitet. Für diese Organisation ist kein bestehender Suchindex hinterlegt, auf den in der Zwischenzeit zurückgegriffen werden kann — Suche und Chat-Antworten mit Bezug auf Ihre Inhalte liefern deshalb bis zum Abschluss keine Treffer. Je nach Anbieter und Datenmenge dauert das Minuten bis Stunden.
            search_body_paused: Ihre Inhalte werden neu für die Suche aufbereitet, sobald im nächsten Monat wieder Kontingent zur Verfügung steht. Bis dahin liefert die Suche unverändert Treffer aus dem bisherigen Index.
            search_body_hard_paused: Ihre Inhalte werden neu für die Suche aufbereitet, sobald im nächsten Monat wieder Kontingent zur Verfügung steht. Für diese Organisation ist kein bestehender Suchindex hinterlegt — Suche und Chat-Antworten mit Bezug auf Ihre Inhalte liefern deshalb bis dahin keine Treffer.
            search_recipients: "Suchanfragen und Sucheinträge gehen heute an %{today}, nach der Umstellung an %{after}."
            search_gap: Inhalte, die während der Umstellung neu entstehen, sind erst auffindbar, wenn die Umstellung abgeschlossen ist.
            recipient_custom: die Anbieter-Konfiguration dieser Organisation
            ai_disabled_note: Die KI-Features dieser Organisation sind nicht aktiviert. Es werden deshalb keine Inhalte an einen Anbieter übertragen, kein Suchindex neu aufgebaut und keine Credits verbraucht. Der Wechsel legt nur fest, welches Paket gilt, sobald Sie die KI-Features aktivieren.
            confirm_button: Wechsel starten
            cancel_button: Abbrechen
