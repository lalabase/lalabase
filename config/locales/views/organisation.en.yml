      ai_settings:
        show:
          # What is NO LONGER here: the strings of the old provider form (system vs. own
          # credentials, the API key field, the security notice, "Own configuration" …).
          # S7 moved that form onto its own page, where it got fresh keys under
          # views.organisations.ai_overview.configuration.*; the 27 keys here were left
          # without a single reader. A key with no reader is not a spare, it is a claim
          # about a screen that does not exist.
          test_connection: Test connection
          # The switch now lives on the overview (doc/ki_zugang_umbau_plan.md D1/D5).
          # What stood here — the status heading, "activated on X by Y", the consent
          # long-text and the two switch labels — moved with it and is now under
          # views.organisations.ai_overview.activation.*. What stays is one line of
          # orientation with a link and no data of its own.
          status_line_active_html: AI features are active. They are switched on and off on the %{link}.
          status_line_inactive_html: AI features are not activated. You can prepare the access here; activation happens on the %{link}.
          status_line_overview_link: overview
        # KI-Pakete §7/§7.1: card catalogue plus the two filters. The block spans
        # show.html.erb and the _package_* partials — hence its own
        # partial-spanning owner (pattern: views.admin.ai_credentials.seam).
        packages:
          title: AI package
          intro: A package decides which provider processes your organisation's chat and search, and under which jurisdiction that happens.
          current_label_package: "Current: %{name} — %{description}"
          current_label_custom: "Current: own configuration"
          current_custom_hint: The organisation's own credentials apply, stored under "Own configuration".
          # doc/ki_zugang_umbau_plan.md D7, state Z3: neither a package nor own
          # credentials. This line used to read "Current: own configuration" — a decision
          # nobody had made. It states what is true and names both ways instead.
          none_configured_title: No AI access set up yet
          none_configured_hint: Pick a system package or store your own credentials. Until then neither way is available.
          # doc/ki_zugang_umbau_plan.md D6: the either/or as two tiles. `active_chip`
          # says which way is IN FORCE; which way is currently OPEN is said by the
          # selection frame. Two statements, two carriers: otherwise looking at the
          # other way would read as a switch already made.
          chooser:
            packages_title: System package
            packages_subline: Curated packages with a checked jurisdiction and processing location.
            custom_title: Own configuration
            custom_subline: This organisation's own API keys and provider settings.
            active_chip: Active
          # P4c (E1): the state of a package switch already underway, right below the
          # "Current" line. The keys are named after Embeddings::SwitchProgress::STATES,
          # so adding a state there surfaces the gap here instead of hiding it.
          progress:
            building_title: Search is being rebuilt
            building_body: "%{remaining} of %{total} records still to go — %{percent} % are in the new index."
            awaiting_flip_title: Rebuild complete
            awaiting_flip_body: The new search index is complete. It usually becomes active automatically within fifteen minutes — nothing for you to do.
            paused_title: Switch paused
            paused_body: Your AI allowance for this month is used up, so the rebuild is on hold. It resumes automatically once the allowance resets next month.
            # Not progress but a halt: the target space is complete yet taken out of
            # the index. A rebuild does NOT repair this (it would find nothing to do);
            # it needs reactivation by the operator — so the text names a
            # responsibility rather than a waiting time.
            retired_target_title: Switch stalled
            retired_target_body: The target index is complete but currently not in use. This will not resolve on its own — please contact your system administrator. Your search keeps working unchanged in the meantime.
            # ONE search sentence: every state that reaches the notice has a resolved
            # pointer, so the old index keeps serving until the flip. The former second
            # variant for pointerless orgs is gone — it would have warned every healthy
            # organisation along with them (review blocker 1).
            search_kept: Your existing content stays findable in the meantime — search reads from the previous index until the rebuild finishes. Content created during that window becomes searchable afterwards.
          # P4c (E5): the org's own package is not in the grid — two ways in, with
          # different outcomes.
          outside_grid:
            filtered_title: Your current package is hidden by the filters
            filtered_body: It does not meet the criteria set above. The card is shown here anyway so you can change your service tier. Relax the filters to see it in the catalogue again.
            withdrawn_title: Your current package is no longer offered
            withdrawn_body: The operator has withdrawn this package. It keeps running for you unchanged, but its service tier can no longer be changed. To change that, pick another package below or "own configuration".
          filters:
            heading: Narrow the selection
            hint: The strictest combination is preselected. Every relaxation is a deliberate decision.
            provider: Provider
            provider_eu: EU companies
            provider_any: non-European companies too
            processing: Processing
            processing_eu: in the EU only
            processing_any: outside the EU too
          jurisdictions:
            blank: Not stated
            eu_native: European
            eu_region_foreign_provider: EU region, non-European provider
            eu_provider_foreign_region: EU provider, third-country region
            non_eu: Outside the EU
            self_hosted: Own server
          # The restricting addendum from §7, deliberately in the same font size as
          # the description. `eu_native` has NO entry: it is the only rung without a
          # third-country transfer (§3.1). That every other rung carries an addendum
          # is enforced by a spec — otherwise a newly added rung would silently fall
          # into the harmless-looking state.
          jurisdiction_notes:
            eu_region_foreign_provider: Processing happens in the EU, but the provider is a non-European company and is subject to the law of its home country. Legally this counts as a third-country transfer.
            eu_provider_foreign_region: The provider is a European company, but the data is processed outside the EU. Your data therefore leaves the EU.
            non_eu: Provider and processing are both outside the EU. Your data therefore leaves the EU.
            self_hosted: Processing runs on a self-operated server. The operator of this installation is responsible for it, not an external provider.
          # T5: the second badge. The STRICTEST value of the referenced credentials —
          # a package is only as good as its weakest one. `self_hosted` has no entry
          # and needs none: the card renders no badge there, because the question is
          # groundless rather than unanswered.
          training_usages:
            excluded: No training
            used: Training by the provider
            unspecified: Training not assured
          # An addendum for every value but the harmless one — same rule as the
          # jurisdiction rungs, pinned by a guard spec for the same reason: a
          # missing statement reads as an all-clear.
          training_notes:
            used: The provider uses content you process through the AI features to train its models.
            unspecified: We hold no contractual assurance about model training for this package. That does not mean training happens — it means we cannot evidence that it does not.
          # The third claim is a sentence, not a badge (E1). Unlike the jurisdiction,
          # the good value carries a sentence too: this axis has no badge of its own,
          # so without one "not stored" would stay invisible.
          retention_notes:
            none: Your content is not stored by the provider.
            limited:
              one: Your content is stored by the provider for up to one day.
              other: Your content is stored by the provider for up to %{count} days.
            unlimited: The provider stores your content with no assured time limit.
            unspecified: We hold no contractual assurance about the storage period for this package.
          card:
            processing_region: "Processing location: %{region}"
            tiers_heading: Included tiers
            # Same ladder, two readings: on another card it describes the
            # package, on the selected one it is the switcher (§7).
            tier_switch_heading: Performance tier
            tier_provider_missing: Provider not configured yet
            tier_unavailable: Credentials disabled — not selectable right now
            # P4c (E5): a DIFFERENT reason from tier_unavailable, hence its own text.
            # The tier is not broken — its chat works and the org is running on one of
            # them — the package is simply no longer offered. Recycling "credentials
            # disabled" here would send the customer to the credentials instead of to
            # the package.
            tier_withdrawn: Package no longer offered — tier cannot be changed
            tier_utility_hint: Helper tasks — participant detection, ticket and document summaries, ticket suggestions and the indexing of connected repositories — always run on "%{tier}" regardless. This does not change the jurisdiction.
            # The same statement with the sign flipped: helper tasks still run on
            # this tier, it just cannot serve right now. Without its own copy the
            # hint above promises five features that are all down — precisely when
            # the customer picked a DIFFERENT tier and their chat keeps working.
            tier_utility_unavailable: Helper tasks — participant detection, ticket and document summaries, ticket suggestions and the indexing of connected repositories — always run on "%{tier}". That tier's credentials are currently disabled, so these features are unavailable — even though you selected a different tier. Please contact your system administrator.
            provider_note_summary: What the provider contractually does with the data
            selected_badge: Selected
            select_button: Choose this package
            selected_button: Currently selected
            # P4b turned the refusal into a detour: the switch is possible, but it
            # goes through the consequence dialog (#confirm_package) rather than
            # from a bare button.
            switch_notice: This package uses a different search index than your current one. Before the switch we show you what changes legally, what rebuilding the search costs and what happens to your search in the meantime.
            switch_button: Review switch
            # The second refusal door of the same card (P3): the tier a fresh
            # selection would land on has no usable credentials. Its own copy, because
            # it is about neither the jurisdiction nor the search index.
            selection_blocked: This package cannot be selected right now — the credentials of its default tier are disabled. Please contact your system administrator.
            selection_blocked_button: Not selectable right now
          empty:
            title: No package meets both criteria
            hint_provider: Set to "non-European companies too", the provider filter shows at least one package.
            hint_processing: Set to "outside the EU too", the processing filter shows at least one package.
            hint_both: Relaxed on its own, either filter shows at least one package — relax the one that matters less to you.
            hint_relax_both: Only relaxing both filters brings a package into view — neither relaxation is enough on its own.
            hint_none: No package is published at the moment. Please contact your system administrator.
          custom:
            title: Own configuration
            description: Not a curated package but this organisation's own provider settings — including your own API keys.
            note: Jurisdiction and processing location are then yours to answer for; no package text covers them.
            # The way back is the same switch as the way in and takes the same
            # detour — its own text because the direction differs.
            switch_notice: Going back to your own configuration would search your content with a different model. This switch, too, goes through the consequence overview first.
            select_button: Use own configuration
            selected_badge: Selected
            # S7: until then the card was the SELECTION with nothing behind it — the
            # SETUP was a second form on the same page. This line is the door §3.4
            # asked for from the start.
            configure_link: Set up credentials
            access_present: "Stored: own access for %{provider}."
            access_failed: The last connection check failed.
            # D7: absence, stated. There was nothing here before, in the very state
            # that needs explaining most. `not_ready_hint` is added on top when this way
            # is IN FORCE and still has nothing behind it.
            not_configured: No credentials stored yet.
            not_ready_hint: Without stored credentials the AI functions cannot work. Set the access up or pick a system package.
          # KI-Pakete P4b (doc/ki_pakete_p4_plan.md §4): the consequence dialog in
          # front of a switch that moves the search index. A page of its own rather
          # than a modal — reasoning at the top of confirm_package.html.erb.
          switch:
            title: Review package switch
            intro: 'You are about to switch to "%{target}". What that means is set out below — the switch only starts once you confirm it.'
            unavailable: This package is not available for selection right now.
            tier_unusable: This package cannot be selected at the moment — its default performance tier is unavailable. Please contact the operator.
            same_lane: This choice does not move the search index — you can pick it directly from the overview.
            legal_heading: Jurisdiction
            side_today: Today
            side_after: After the switch
            jurisdiction_unstated: No jurisdiction is recorded for this configuration — jurisdiction and processing location are yours to answer for.
            # Four cases, not three: a package that claims nothing must be reported
            # as neither an improvement nor a deterioration.
            jurisdiction_change:
              unchanged: The jurisdiction stays the same.
              to_eu_native: The switch removes the third-country transfer — provider and processing are then both in the EU.
              from_eu_native: The switch creates a third-country transfer. Your content will no longer be processed exclusively by a European company inside the EU.
              changed: The jurisdiction changes. Please compare the two statements above.
              unstated: At least one of the two sides records no jurisdiction — whether anything changes about the third-country transfer cannot be derived from that. Please compare the two statements above.
              self_hosted_target: Processing moves to a self-operated server. No transfer to an external provider takes place after that; the operator of this installation is then responsible for jurisdiction and processing location.
              self_hosted_source: Processing leaves the self-operated server and goes to an external provider. Please check the jurisdiction statement above.
            # T7: same construction as above, one axis deeper. There is deliberately
            # NO entry for "one side states nothing" — the view renders no line at
            # all there, because the jurisdiction verdict already explains the case
            # (self_hosted or "own configuration"). A sentence here would have to
            # claim something about the empty side, which is exactly the defect the
            # #437 review pulled out of the neighbouring method four times.
            training_change:
              unchanged: The training assurance does not change.
              to_used: "Careful: the new provider uses your content to train its models. Until now that was contractually excluded."
              to_excluded: The new provider contractually excludes using your content for model training. Until now that was not assured.
              not_comparable: At least one of the two sides carries no contractual assurance about model training — whether anything changes cannot be derived from that. Please compare the two statements above.
            cost_heading: Scope and cost
            cost_estimate: "The migration covers roughly %{records} records and corresponds to an estimated %{credits} credits."
            cost_estimate_hint: An estimate, not a price — the token count is approximated (it can come out higher as well as lower), and entries that already exist are skipped. The actual billing may land below this, or above it for very code-heavy content.
            quota_covered: "Your remaining monthly quota (%{remaining} credits) covers the migration even with the safety margin."
            quota_short_title: The estimate exceeds your remaining quota
            quota_short_body: "Your monthly quota has %{remaining} credits left. Because the estimate is imprecise we plan with a 30%% safety margin — that is %{planned} credits, and therefore %{shortfall} more than you have left. If the quota runs out, chat and semantic search stop working until the start of next month."
            quota_exhausted_title: Your monthly quota is used up
            quota_exhausted_body: The switch is saved, but the rebuild only starts once quota is available again next month.
            search_heading: Search during the migration
            search_body: Your content is being prepared for search again in the background. Until that finishes, search keeps returning results from the existing index — depending on the provider and the amount of data this takes minutes to hours.
            search_body_hard: Your content is being prepared for search again in the background. This organisation has no existing search index to fall back on in the meantime, so search — and chat answers that draw on your content — will return nothing until it finishes. Depending on the provider and the amount of data this takes minutes to hours.
            search_body_paused: Your content will be prepared for search again once quota is available next month. Until then, search keeps returning results from the existing index.
            search_body_hard_paused: Your content will be prepared for search again once quota is available next month. This organisation has no existing search index, so search — and chat answers that draw on your content — will return nothing until then.
            search_recipients: "Search queries and search entries go to %{today} today and to %{after} after the migration."
            search_gap: Content created during the migration only becomes findable once the migration has finished.
            recipient_custom: this organisation's own provider configuration
            ai_disabled_note: This organisation's AI features are not activated. No content is therefore transmitted to any provider, no search index is rebuilt and no credits are spent. The switch merely records which package applies once you activate the AI features.
            confirm_button: Start switch
            cancel_button: Cancel
