          time_self_cannot: Users CANNOT change their own TimeSession permissions
          faq_title: Frequently Asked Questions
          faq_q1: Why don't I see buttons for some areas?
          faq_a1: For TimeSession permissions, the actual permissions are displayed as text instead of buttons. Missing permissions are shown with strikethrough.
          faq_q2: What does "modified" mean for a role?
          faq_a2: This indicates that the project-specific permissions differ from the default permissions of the role.
          faq_q3: Can I give a user read-only permissions for TimeSessions but no create permissions?
          faq_a3: Yes! Through the advanced TimeSession settings, you can precisely control which actions are allowed.
          faq_q4: What happens when I revoke all permissions from a user?
          faq_a4: The user is removed from the project member list and no longer has access to the project.
          faq_q5: What happens to permissions when a user changes roles?
          faq_a5: Role-based permissions are automatically adjusted. However, project-specific permissions remain unchanged as they override role permissions.
          faq_q6: Can I create permission templates or copy permissions from one user to another?
          faq_a6: Currently there is no template feature. You need to set permissions individually for each user. This ensures that permissions are granted consciously and deliberately.
          faq_q7: How can I see which permissions come from the role and which are project-specific?
          faq_a7: When project permissions differ from role permissions, "(modified)" appears next to the role. In edit mode, you can click the info icon to show role permissions.
          faq_q8: Is there an overview of who has which permissions across all my projects?
          faq_a8: Permission management is per project. For an organisation-wide overview, you would need to check each project individually. Account admins automatically have full access to all projects.
          faq_q9: What happens to TimeSessions when I subsequently revoke a user's permissions?
          faq_a9: Already created TimeSessions remain. Depending on the new permissions, the user may no longer be able to view or edit them. The data is not deleted, only access is restricted.
