          overview_title: Overview of Permission Levels
          overview_intro: 'Permission management in Lalabase operates on three levels:'
          level_admin_title: 1. Account Admin
          level_admin_description: Has full access to all projects and features of the organisation.
          level_role_title: 2. Role-based
          level_role_description: Global permissions through the user's role in the organisation.
          level_project_title: 3. Project-specific
          level_project_description: Individual permissions per user and project.
          override_notice: 'Important: Project-specific permissions override role-based permissions!'
          removing_title: Taking someone off a project
          removing_intro: '"Remove" always means the same thing: this person should no longer work here. How it is carried out depends on where their access comes from.'
          removing_plain_title: Without a role right
          removing_plain_description: The project permission is deleted. The person leaves the list and shows up under "Add member" again.
          removing_blocked_title: With a role right
          removing_blocked_description: Deleting would achieve nothing, because the role hands the access straight back. Instead a project permission with "No access" is written, which overrides the role. The row stays visible and is marked "Blocked". "Lift block" undoes it, and what the role allows applies again.
          removing_admin_notice: 'Exception: an account admin has access to every project and no project permission can override that. Only changing their role helps here.'
          access_levels_title: The Three Access Levels
          no_access_title: No Access
          no_access_description: The user cannot see or access this area.
          read_only_title: Read Only
          read_only_description: The user can view content but cannot make changes.
