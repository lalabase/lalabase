  views:
    time_sessions:
      # Die Wörter für den Abrechnungsstand einer Zeit. EIN Besitzer für alle
      # Oberflächen: Filterpillen, Übersichtstabelle, Zeitenliste, Ticket-Tabelle,
      # Stunden-Chip, Abrechnungsliste, Assistent-Bericht und die beiden
      # Dashboard-Widgets. Gelesen ausschließlich über
      # TimeSessionsHelper#time_billing_state_label.
      #
      # Reihenfolge und Schlüssel sind die von TimeSession::BILLING_STATUS_FILTERS
      # (Lebenszyklus von links nach rechts). Vor S1 hieß dasselbe an neun Stellen
      # anders: Berechnet / Abgerechnet, Zur Abrechnung / In Abrechnung,
      # Ohne Rechnung / Nicht berechnet / Offen. Rechnung und Abrechnung sind zwei
      # Dinge, deshalb kommt "Rechnung" in keinem der drei Wörter mehr vor.
      billing_status:
        without_billing: offen
        in_billing: zur Abrechnung
        billed: berechnet
        mixed: Gemischt
        partial: "teilweise %{percent} %"
        hidden_note: "%{shown} von %{total} · %{hidden} ausgeblendet"
        visible_sum: Summe der sichtbaren Zeiten
        without_subject: Ohne Bezug
        entries_count:
          one: "%{count} Zeit"
          other: "%{count} Zeiten"
