default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 600
      
  workers:
    - queues: [notifications, emails]
      threads: 3
      processes: 2
      polling_interval: 0.1

    - queues: [default, digest]  
      threads: 2
      processes: 1
      polling_interval: 1

development:
  <<: *default
  workers:
    - queues: "*"
      threads: 2
      processes: 1
      polling_interval: 1

test:
  <<: *default
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 5

production:
  <<: *default
  workers:
    - queues: [notifications, emails]
      threads: 5
      processes: 3
      polling_interval: 0.1

    - queues: [default, digest]
      threads: 3
      processes: 2
      polling_interval: 1

staging:
  <<: *default
  workers:
    - queues: [notifications, emails]
      threads: 3
      processes: 2
      polling_interval: 0.5

    - queues: [default, digest]
      threads: 2
      processes: 1
      polling_interval: 2