# Lalabase application logs. copytruncate is mandatory, not cosmetic: Rails holds an
# open handle (config/environments/production.rb) and solid_queue is attached via
# systemd StandardOutput=append: — a rename would leave both writing to the old inode.
# __DEPLOY_ROOT__ is filled in at install time (ops/backup/README.md).
__DEPLOY_ROOT__/shared/log/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su deploy deploy
}

/var/log/lalabase-backup.log {
    monthly
    rotate 12
    missingok
    notifempty
    compress
    # /var/log is root:syslog, so logrotate refuses to touch it without an explicit su.
    su root syslog
}
